name: Build & Release ESP8266 Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'Area27_Sinuca/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build ESP8266 & Update firmware.bin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Board Core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Compile ESP8266 Firmware
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:generic --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json --output-dir ./build ./Area27_Sinuca/Area27_Sinuca.ino
          cp ./build/Area27_Sinuca.ino.bin ./Area27_Sinuca/firmware.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: ./Area27_Sinuca/firmware.bin

      - name: Commit and Push Updated firmware.bin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./Area27_Sinuca/firmware.bin
          git diff --staged --quiet || (git commit -m "auto: build & update firmware.bin [skip ci]" && git push)
